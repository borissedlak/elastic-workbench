<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>Local Image Grid Slider</title>
    <style>
        :root { --controls-h: 64px; /* adjust if your controls row is taller */ }

        html, body {
            height: 100%;
            margin: 0;         /* remove default margin so 100vh is exact */
            overflow: hidden;  /* prevent page scrolling */
        }

        body {
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;     /* use padding instead of margin */
            height: 100vh;     /* explicit viewport height */
        }



        #slider-container {
            width: 80%;
            height: var(--controls-h);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }



        #time-slider-label {
            margin-bottom: 20px;
        }

        /* grid takes the remaining viewport height after the slider-container */
        #grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: 1fr 0.45fr 1fr; /* middle row smaller */
            gap: 5px;
            width: 80%;
            /* add bottom spacing of 20px */
            height: calc(100vh - var(--controls-h) - 80px); /* 40px padding + 20px extra bottom space */
        }



        /* let grid cells size to the grid row height (don't force aspect-ratio) */
        .service-output,
        .rask-model,
        .slo-f {
            position: relative;
            overflow: auto;
            background-color: #eee;
            height: 100%;
        }

        /* ensure images fill the grid cell */
        .service-output img,
        .rask-model img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }


        /* playback controls row */
        #playback-controls {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: 8px;
        }

        button {
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #bbb;
            background: #fff;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.5;
            cursor: default;
        }

    </style>
</head>
<body>

<!-- TODO: Create a controls box on the left of the scene -->
<div id="slider-container">
    <label for="time-slider"></label>
    <input type="range" id="time-slider" min="1" max="1" step="1" value="1" style="width:100%;">
    <div id="playback-controls">
        <button id="play-btn">Play ▶</button>
        <button id="pause-btn" disabled>Pause ⏸</button>
    </div>
</div>
<div id="time-slider-label"></div>

<div id="grid">
    <div class="service-output" id="qr-output"><img src="" alt=""></div>
    <div class="service-output" id="cv-output"><img src="" alt=""></div>
    <div class="service-output" id="pc-output"><img src="" alt=""></div>

    <div class="slo-f" id="qr-slo-f">
        <div><span>SLO-F 0</span> <progress id="qr-slo-f-abs" max="1"></progress> <span>1</span></div>
        <div><span>Quality 0</span> <progress id="qr-slo-f-quality" max="800"></progress> <span>800</span></div>
        <div><span>Cores 0</span> <progress id="qr-slo-f-cores" max="8"></progress> <span>8</span></div>
        <div><span>Tp 0</span> <progress id="qr-slo-f-tp" max="80"></progress> <span>80</span></div>
    </div>

    <div class="slo-f" id="cv-slo-f">
        <div><span>0</span> <progress id="cv-slo-f-abs" max="1"></progress> <span>1</span></div>
        <div><span>0</span> <progress id="cv-slo-f-quality" max="288"></progress> <span>288</span></div>
        <div><span>0</span> <progress id="cv-slo-f-cores" max="8"></progress> <span>8</span></div>
        <div><span>0</span> <progress id="cv-slo-f-tp" max="5"></progress> <span>5</span></div>
        <div><span>0</span> <progress id="cv-slo-f-model" max="3"></progress> <span>3</span></div>
    </div>

    <div class="slo-f" id="pc-slo-f">
        <div><span>0</span> <progress id="pc-slo-f-abs" max="1"></progress> <span>1</span></div>
        <div><span>0</span> <progress id="pc-slo-f-quality" max="40"></progress> <span>40</span></div>
        <div><span>0</span> <progress id="pc-slo-f-cores" max="8"></progress> <span>8</span></div>
        <div><span>0</span> <progress id="pc-slo-f-tp" max="50"></progress> <span>50</span></div>
    </div>



    <div class="rask-model" id="qr-rask"><img src="" alt=""></div>
    <div class="rask-model" id="cv-rask"><img src="" alt=""></div>
    <div class="rask-model" id="pc-rask"><img src="" alt=""></div>
</div>

<script>

    const slider = document.getElementById('time-slider');
    const sliderLabel = document.getElementById('time-slider-label');

    const service_outputs_qr = document.getElementById('qr-output').querySelector('img');
    const service_outputs_cv = document.getElementById('cv-output').querySelector('img');
    const service_outputs_pc = document.getElementById('pc-output').querySelector('img');

    const rask_model_qr = document.getElementById('qr-rask').querySelector('img');
    const rask_model_cv = document.getElementById('cv-rask').querySelector('img');
    const rask_model_pc = document.getElementById('pc-rask').querySelector('img');

    slider.max = 60 * 10;

    function loadCSV(path) {
        return fetch(path)
            .then(res => res.text())
            .then(text => new Promise(resolve => {
                Papa.parse(text, {
                    header: true,
                    skipEmptyLines: true,
                    complete: function (results) {
                        results.data.forEach(r =>
                            r.state = Function('"use strict";return(' +
                                r.state.replace(/\bNone\b/g, "null")
                                       .replace(/\bTrue\b/g, "true")
                                       .replace(/\bFalse\b/g, "false") +
                            ')')()
                        );
                        console.log(`CSV loaded: ${path}`, results.data);
                        resolve(results.data);
                    }
                });
            }));
    }

    let csv_data_train, csv_data_operate;
    loadCSV("agent_experience_EXPLORE.csv")
    .then(data => {
        csv_data_train = data;
        return loadCSV("agent_experience_OPERATE.csv");
    })
    .then(data => {
        csv_data_operate = data;
    })
    .then(() => {
        loadUI(1);
    });


    function loadUI(progress_time) {

        const share = "../../share/service_output"
        service_outputs_qr.src = `${share}/elastic-workbench-qr-detector/${progress_time+1}.jpg`
        service_outputs_cv.src = `${share}/elastic-workbench-cv-analyzer/${progress_time+1}.jpg`
        service_outputs_pc.src = `${share}/elastic-workbench-pc-visualizer/${progress_time+1}.jpg`

        // TODO: Current SLO-F in a non-changeable slider --> agent experience file
        // Expected SLO-F in a non-changeable slider --x not directly supported
        // TODO: All interventionable parameters + SLO range --> agent experience file + static threshold
        // TODO: Actual throughput + SLO range --> agent experience file + static threshold

        const agent_cycle = 1 + Math.floor(progress_time / 10)
        const csv_data = progress_time <= 90 ? csv_data_train : csv_data_operate
        console.log(agent_cycle, csv_data[(agent_cycle * 3)])


        // Because the first cycle = 1, I subtract from the cycle * 3
        document.getElementById('qr-slo-f-abs').value = csv_data[(agent_cycle * 3)]['slo_f']
        document.getElementById('qr-slo-f-quality').value = csv_data[(agent_cycle * 3)]['state']['data_quality']
        document.getElementById('qr-slo-f-cores').value = csv_data[(agent_cycle * 3)]['state']['cores']
        document.getElementById('qr-slo-f-tp').value = csv_data[(agent_cycle * 3)]['state']['throughput']

        document.getElementById('cv-slo-f-abs').value = csv_data[(agent_cycle * 3) + 1]['slo_f']
        document.getElementById('cv-slo-f-quality').value = csv_data[(agent_cycle * 3) + 1]['state']['data_quality']
        document.getElementById('cv-slo-f-cores').value = csv_data[(agent_cycle * 3) + 1]['state']['cores']
        document.getElementById('cv-slo-f-tp').value = csv_data[(agent_cycle * 3) + 1]['state']['throughput']
        document.getElementById('cv-slo-f-model').value = csv_data[(agent_cycle * 3) + 1]['state']['model_size']

        document.getElementById('pc-slo-f-abs').value = csv_data[(agent_cycle * 3) + 2]['slo_f']
        document.getElementById('pc-slo-f-quality').value = csv_data[(agent_cycle * 3) + 2]['state']['data_quality']
        document.getElementById('pc-slo-f-cores').value = csv_data[(agent_cycle * 3) + 2]['state']['cores']
        document.getElementById('pc-slo-f-tp').value = csv_data[(agent_cycle * 3) + 2]['state']['throughput']

        const path = "rask_plots/rask_plot_elastic-workbench-"
        rask_model_qr.src = `${path}qr-detector_${agent_cycle}.jpg`
        rask_model_cv.src = `${path}cv-analyzer_${agent_cycle}.jpg`
        rask_model_pc.src = `${path}pc-visualizer_${agent_cycle}.jpg`

        sliderLabel.textContent = `Time in Demo ${progress_time} / ${slider.max}s`;
    }

    slider.addEventListener('input', e => loadUI(parseInt(e.target.value)));

    const playBtn = document.getElementById('play-btn');
    const pauseBtn = document.getElementById('pause-btn');

    // Playback logic
    let playInterval = null;

    function startPlayback() {
        if (playInterval) return;
        playBtn.disabled = true;
        pauseBtn.disabled = false;

        playInterval = setInterval(() => {
            let current = parseInt(slider.value, 10);
            const max = parseInt(slider.max, 10);
            if (current >= max) {
                stopPlayback();
                return;
            }
            let next = current + 1;
            slider.value = next;
            loadUI(next);
        }, 120); // 1 step per second
    }

    function stopPlayback() {
        if (playInterval) {
            clearInterval(playInterval);
            playInterval = null;
        }
        playBtn.disabled = false;
        pauseBtn.disabled = true;
    }

    playBtn.addEventListener('click', () => {
        const current = parseInt(slider.value, 10);
        const max = parseInt(slider.max, 10);
        if (current >= max) {
            // already at end — keep at max (or set slider.value = 1 to restart)
            slider.value = max;
            loadUI(max);
            return;
        }
        startPlayback();
    });

    pauseBtn.addEventListener('click', () => {
        stopPlayback();
    });

    // If user drags to end, stop playback so buttons stay consistent
    slider.addEventListener('change', () => {
        const current = parseInt(slider.value, 10);
        const max = parseInt(slider.max, 10);
        if (current >= max) stopPlayback();
    });

    // cleanup on unload
    window.addEventListener('beforeunload', () => {
        if (playInterval) clearInterval(playInterval);
    });

    // Toggle playback with space bar
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
            e.preventDefault(); // prevent scrolling
            if (playInterval) {
                stopPlayback();
            } else {
                startPlayback();
            }
        }
    });


</script>

</body>
</html>
